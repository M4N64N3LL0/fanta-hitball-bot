name: Aggiornamento Punti FantaHitball

on:
  workflow_dispatch: # Ti permette di farlo partire a mano cliccando su "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione librerie
        run: |
          pip install requests beautifulsoup4 firebase-admin

      - name: Esecuzione Scraper
        env:
          # Questo collega il Secret di GitHub al codice Python
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scraper.py
