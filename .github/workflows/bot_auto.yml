name: Aggiornamento Punti FantaHitball

on:
  schedule:
    # Ogni mattina alle 08:00 italiane (06:00 UTC)
    - cron: '0 6 * * *'
    
    # Ogni ora dalle 17:00 alle 00:00 italiane (15:00-22:00 UTC)
    - cron: '0 15-22 * * *'
    
  workflow_dispatch: # Ti permette di farlo partire a mano cliccando su "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione librerie
        run: |
          pip install requests beautifulsoup4 firebase-admin

      - name: Esecuzione Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scraper.py
