name: Aggiornamento Punti FantaHitball

on:
  schedule:
    # Esegue il bot alle 09:00, 18:00 e 00:00 italiane (ora legale)
    - cron: '0 7,16,22 * * *'
    
  workflow_dispatch: # Ti permette di farlo partire a mano cliccando su "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione librerie
        run: |
          pip install requests beautifulsoup4 firebase-admin cloudscraper

      - name: Esecuzione Scraper definitivo
        run: python -u scraper.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
